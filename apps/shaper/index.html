<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Editor — Shaper Origin</title>
  <link rel="stylesheet" href="styles/main.css">
  <!-- Shared sketcher theme contract (P1). Linked AFTER main.css so Shaper's own :root override (below) wins. -->
  <link rel="stylesheet" href="../../packages/ui/sketcher.css">
  <!-- Isomorphic aliases (mirror SketchStudio + package.json): #core = shared brain, #ui = shared UI.
       Added for the shared Design tab (S1); Shaper's own modules keep using relative ./src imports. -->
  <script type="importmap">
  {
    "imports": {
      "#core/": "../../packages/core/",
      "#ui/": "../../packages/ui/"
    }
  }
  </script>
  <style>
    /* Shaper sketcher theme — DARK (kept per design; SketchStudio stays light via the #ui/sketcher.css
       defaults). Overrides the shared contract; this :root comes AFTER the sketcher.css link so it wins.
       Unused until Shaper's Design tab adopts the full renderer (P5) — declared now so that lands dark. */
    :root {
      --sk-canvas-bg: #14161a;
      --sk-canvas-bg-snapping: #2a2416;
      --sk-grid-minor: #2a2d33;
      --sk-grid-major: #3a4250;
      --sk-geo-fixed: #e6e6e6;
      --sk-geo-constrained: #4c9aff;
      --sk-geo-free: #7aa7e0;
      --sk-geo-fully: #34d399;
      --sk-construction: #fb923c;
      --sk-muted: #9aa0a6;
      --sk-joint-fill: #2b2d31;
      --sk-constraint-fill: #4c9aff;
      --sk-constraint-stroke: #93c5fd;
      --sk-perpendicular-stroke: #22d3ee;
      --sk-dimension: #93c5fd;
      --sk-dimension-snap: #34d399;
      --sk-selection: #4c9aff;
      --sk-hover: #7aa7e0;
      --sk-origin: #4c9aff;
      --sk-error: #f87171;
      /* S7b: dark chrome for the shared tool ribbon (light defaults live in the component; this :root retints). */
      --sk-ribbon-bg: #111827;
      --sk-ribbon-sep: #1f2937;
      --sk-ribbon-hover: rgba(255,255,255,0.08);
      --sk-ribbon-fg: #cbd5e1;
      --sk-ribbon-grouplabel: #6b7280;
      --sk-ribbon-menu-bg: #1b2030;
    }
    #design-view, #view-prepare, #view-simexport { position: absolute; inset: 44px 0 0 0; display: flex; background: #0b1020; z-index: 5; }
    #design-view[hidden], #view-prepare[hidden], #view-simexport[hidden] { display: none; }
    /* S7b: Design = a full-width tool ribbon on TOP, then a row of [collapsible info panel | canvas]. */
    #design-view { flex-direction: column; }
    #design-ribbon { flex: 0 0 auto; width: 100%; overflow-x: auto; border-bottom: 1px solid #1f2937; }
    #design-body { flex: 1 1 auto; display: flex; min-height: 0; }
    #design-panel { flex: 0 0 244px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: #111827; border-right: 1px solid #1f2937; color: #cbd5e1; transition: flex-basis 0.15s ease; }
    #design-panel.collapsed { flex-basis: 30px; }
    #design-panel.collapsed #design-panel-info { display: none; }
    #design-panel-toggle { align-self: flex-end; background: transparent; border: 0; color: #9aa0a6; cursor: pointer; font: 13px system-ui, sans-serif; padding: 6px 8px; line-height: 1; }
    #design-panel-toggle:hover { color: #cbd5e1; }
    #design-panel.collapsed #design-panel-toggle { align-self: center; }
    #design-panel-info { flex: 1 1 auto; overflow: auto; min-height: 0; padding: 8px; }
    #design-canvas { flex: 1; min-width: 0; min-height: 0; }
    /* Prepare / Simulate-Export stub views (S6a): centered placeholder text. */
    #view-simexport { flex-direction: column; align-items: center; justify-content: center; color: #9aa0a6; font: 15px system-ui, sans-serif; }
    /* SP1a: Prepare renders the shared sketch geometry (edges only, joints hidden) into its own canvas. */
    #view-prepare { flex-direction: column; }
    #prepare-canvas { flex: 1; width: 100%; min-height: 0; }
    /* SP1f: the cut-settings card — a floating panel, top-right of the Prepare view (shown when a target is selected). */
    #prepare-panel { position: absolute; top: 12px; right: 12px; width: 232px; z-index: 6; pointer-events: none; }
    #prepare-panel .cut-card { pointer-events: auto; background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 12px; color: #cbd5e1; font: 13px system-ui, sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
    .cut-card-title { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #9aa0a6; margin-bottom: 10px; }
    .cut-field-label { display: block; font-size: 12px; color: #9aa0a6; margin-bottom: 5px; }
    .cut-type-dd { position: relative; }
    .cut-type-trigger { display: flex; align-items: center; gap: 8px; width: 100%; background: #0b1020; border: 1px solid #2a2d31; border-radius: 6px; padding: 7px 9px; color: #e6e6e6; cursor: pointer; font: 13px system-ui, sans-serif; }
    .cut-type-trigger:hover { border-color: var(--sk-selection, #4c9aff); }
    .cut-type-cur { flex: 1; text-align: left; }
    .cut-caret { color: #9aa0a6; }
    .cut-sw { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; border: 1px solid rgba(255,255,255,0.15); }
    .cut-type-menu { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #1b2030; border: 1px solid #2a2d31; border-radius: 6px; padding: 4px; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .cut-type-opt { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: 0; border-radius: 4px; padding: 7px 8px; color: #e6e6e6; cursor: pointer; font: 13px system-ui, sans-serif; text-align: left; }
    .cut-type-opt:hover:not(.is-disabled) { background: rgba(255,255,255,0.07); }
    .cut-type-opt.is-current { background: rgba(76,154,255,0.18); }
    .cut-type-opt.is-disabled { opacity: 0.4; cursor: not-allowed; }
    /* SP1g: cut-param rows (depth / offset / bit diameter). */
    .cut-rows { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .cut-row { display: flex; flex-direction: column; gap: 5px; }
    .cut-stepper, .cut-inline { display: flex; align-items: center; gap: 6px; }
    .cut-num { width: 64px; background: #0b1020; border: 1px solid #2a2d31; border-radius: 6px; padding: 6px 8px; color: #e6e6e6; font: 13px system-ui, sans-serif; }
    .cut-num:focus { outline: none; border-color: var(--sk-selection, #4c9aff); }
    .cut-step, .cut-flip { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: #0b1020; border: 1px solid #2a2d31; border-radius: 6px; color: #cbd5e1; cursor: pointer; font: 14px system-ui, sans-serif; flex: 0 0 auto; }
    .cut-step:hover, .cut-flip:hover { border-color: var(--sk-selection, #4c9aff); }
    .cut-flip.is-on { background: rgba(76,154,255,0.2); border-color: var(--sk-selection, #4c9aff); color: #fff; }
    .cut-unit { color: #9aa0a6; font-size: 12px; }
    .cut-presets { display: flex; gap: 4px; margin-top: 6px; }
    .cut-preset { flex: 1; background: #0b1020; border: 1px solid #2a2d31; border-radius: 6px; padding: 5px 0; color: #cbd5e1; cursor: pointer; font: 12px system-ui, sans-serif; }
    .cut-preset:hover { border-color: var(--sk-selection, #4c9aff); }
    .cut-preset.is-active { background: rgba(76,154,255,0.2); border-color: var(--sk-selection, #4c9aff); color: #fff; }
    /* S6a: 4-mode app nav (primary navigation) — replaces the old Design button. */
    .mode-nav { display: flex; gap: 4px; align-items: center; }
    .mode-btn { background: transparent; color: #cbd5e1; border: 0; border-radius: 6px; padding: 5px 14px; cursor: pointer; font: 13px system-ui, sans-serif; opacity: 0.7; }
    .mode-btn:hover { background: rgba(255,255,255,0.08); opacity: 0.95; }
    .mode-btn.active { background: var(--sk-selection, #4c9aff); color: #fff; opacity: 1; }
    /* U3b: header Settings (gear) button → the shared style-panel modal. */
    .settings-btn { background: transparent; color: #cbd5e1; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; font: 15px system-ui, sans-serif; opacity: 0.75; }
    .settings-btn:hover { background: rgba(255,255,255,0.08); opacity: 1; }
  </style>
</head>
<body>
  <header class="toolbar">
    <strong>Shaper</strong>
    <!-- S6a: 4-mode app nav (primary navigation) — replaces the old Design button + the back-to-Editor toggle. -->
    <nav id="mode-nav" class="mode-nav">
      <button class="mode-btn" data-mode="explore">Explore</button>
      <button class="mode-btn" data-mode="design">Design</button>
      <button class="mode-btn" data-mode="prepare">Prepare</button>
      <button class="mode-btn" data-mode="simexport">Simulate/Export</button>
    </nav>
    <span class="spacer"></span>
    <!-- Explore-mode actions (SVG editor file ops) — shown only while Explore is active (router toggles). -->
    <span id="explore-actions">
      <input id="file" type="file" accept=".svg,image/svg+xml" hidden>
      <button id="open">Open SVG</button>
      <button id="fit">Fit</button>
      <button id="export">Export</button>
    </span>
    <!-- U3b: Settings → the shared style-panel MODAL (with the doc-unit toggle). Always visible. -->
    <button id="btn-settings" class="settings-btn" title="Settings" aria-label="Settings">&#9881;</button>
  </header>

  <main class="layout">
    <aside id="tree" class="pane tree"></aside>
    <section id="canvas" class="pane canvas">
      <div class="empty">Drop an SVG here, or click “Open SVG”</div>
    </section>
    <aside id="inspector" class="pane inspector"></aside>
  </main>

  <!-- Shared #core-backed Design canvas (S1 proof). Hidden until the Design tab is toggled. -->
  <section id="design-view" hidden>
    <!-- S7b: full-width tool ribbon on top; below, a row of [collapsible info panel | canvas]. Populated by main.js. -->
    <div id="design-ribbon"></div>
    <div id="design-body">
      <aside id="design-panel">
        <button id="design-panel-toggle" title="Collapse panel" aria-label="Toggle panel">◀</button>
        <div id="design-panel-info"></div>
      </aside>
      <svg id="design-canvas" viewBox="-60 -45 120 90" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </section>

  <!-- S6a stub views (Prepare / Simulate-Export) — fleshed out in a later slice. -->
  <!-- SP1a/d/e/f: Prepare = a Prepare-local render of the shared #core sketch (edges, joints hidden) + loop/edge
       select + the cut-settings card (#prepare-panel, mounted by main.js). -->
  <section id="view-prepare" hidden>
    <svg id="prepare-canvas" viewBox="-60 -45 120 90" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="prepare-panel"></div>
  </section>
  <section id="view-simexport" hidden>Simulate / Export — cut simulation + export (coming soon).</section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
