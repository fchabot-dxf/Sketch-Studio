<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pen Plotter — Sketch Studio</title>
  <!-- Shared sketcher theme contract (mirrors Shaper). The :root override BELOW is after the link, so the
       plotter's own look wins. Placeholder-level theming for PP-1 — the real canvas theming lands in PP-3+. -->
  <link rel="stylesheet" href="../../packages/ui/sketcher.css">
  <!-- Isomorphic aliases (mirror Shaper + package.json): #core = shared brain, #ui = shared UI.
       Declared now for the shared engines/Design tab that arrive in PP-2..PP-5; unused this slice. -->
  <script type="importmap">
  {
    "imports": {
      "#core/": "../../packages/core/",
      "#ui/": "../../packages/ui/"
    }
  }
  </script>
  <style>
    /* Pen Plotter = a THIRD, visually distinct shell: warm PAPER-LIGHT (Studio is cool light, Shaper is dark),
       with a teal "plotter ink" accent. Keeps the three shells distinguishable (project theme rule). */
    :root {
      --sk-selection: #2f8f7f;            /* plotter ink (teal) — distinct from Studio/Shaper blue */
      --sk-hover: #57b0a1;
      --sk-header-bg: #f0e7d4;
      --sk-header-fg: #3a352b;
      --sk-header-sep: #d8cbb2;
      --sk-header-hover: rgba(47, 143, 127, 0.12);
      --sk-ribbon-menu-bg: #fbf6ec;
      --canvas-bg: #fdfcf8;               /* PP-3a: the Draw-stage paper fill (read by render-art buildPaper) */
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; } /* SHARED-TOUCH-ACTION-FIX: page must not scroll on mobile */
    body { background: #f5efe1; color: #3a352b; font: 14px system-ui, sans-serif; display: flex; flex-direction: column;
      touch-action: none; -webkit-user-select: none; user-select: none; } /* matches apps/sketchstudio's page-level lock --
      the canvas already owns its own gestures (packages/ui/sketch-canvas.js); the page must not compete */
    header.toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; height: 44px; padding: 0 12px;
      background: var(--sk-header-bg); border-bottom: 1px solid var(--sk-header-sep); color: var(--sk-header-fg); }
    #app-switcher-host { display: inline-flex; }
    .save-status { font: 11px system-ui, sans-serif; color: #8a8272; opacity: 0.8; margin-left: 10px; } /* PERSIST-2 */
    .mode-nav { display: flex; gap: 4px; align-items: center; }
    .stage-btn { background: transparent; color: #6b6353; border: 0; border-radius: 6px; padding: 5px 14px; cursor: pointer;
      font: 13px system-ui, sans-serif; opacity: 0.8; }
    .stage-btn:hover { background: var(--sk-header-hover); opacity: 1; }
    .stage-btn.active { background: var(--sk-selection); color: #fff; opacity: 1; }
    .stage-btn .opt { font-size: 11px; opacity: 0.65; margin-left: 5px; }
    .spacer { flex: 1; }
    main.stages { flex: 1 1 auto; position: relative; min-height: 0; }
    .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 24px; text-align: center; }
    .stage[hidden] { display: none; }
    .stage h2 { margin: 0; font-size: 24px; font-weight: 700; color: #3a352b; }
    .stage p { margin: 0; color: #8a8067; max-width: 42ch; line-height: 1.5; }
    .stage .badge { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sk-selection); font-weight: 700; }
    /* PP-3a — the Draw stage: a full-bleed canvas (the plotter's own freeform art surface). The scaffold's
       #canvasWrap is absolutely positioned, so the .stage flex-centering (used by the other stubs) ignores it. */
    /* PP-3c — the Draw stage is now canvas + a side panel (import / layers / pens). */
    #stage-draw { padding: 0; }
    #drawRoot { position: absolute; inset: 0; display: flex; }
    #canvasWrap { flex: 1 1 auto; position: relative; overflow: hidden; background: #efe9dd; min-width: 0; }
    #canvas { display: block; }
    #docInfo { position: absolute; left: 12px; bottom: 10px; font: 12px system-ui, sans-serif; color: #8a8067; pointer-events: none; }
    #toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); background: #2f8f7f; color: #fff;
      padding: 6px 12px; border-radius: 8px; font: 13px system-ui, sans-serif; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
    #toast.show { opacity: 1; }
    /* BURN-DOWN-4: persistent banner while target-editing a toolpath (top-center over the canvas). */
    #targetEditBanner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 8;
      background: #ff2e88; color: #fff; padding: 6px 14px; border-radius: 8px; pointer-events: none;
      font: 13px system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.25); white-space: nowrap; }
    #targetEditBanner[hidden] { display: none; }
    /* PP-3b — the floating tool stack + transform HUD + coord readout over the Draw canvas. */
    #canvas.tool-line, #canvas.tool-rect, #canvas.tool-ellipse, #canvas.tool-polyline, #canvas.tool-freehand { cursor: crosshair; }
    #allTools { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
    .tool { background: #fbf6ec; color: #3a352b; border: 1px solid #d8cbb2; border-radius: 6px; padding: 4px 9px;
      font: 12px system-ui, sans-serif; cursor: pointer; text-align: left; }
    .tool:hover { border-color: var(--sk-selection); }
    .tool.active { background: var(--sk-selection); color: #fff; border-color: var(--sk-selection); }
    #coords { position: absolute; right: 12px; bottom: 10px; font: 12px system-ui, sans-serif; color: #8a8067; pointer-events: none; }
    /* MERGE-1: #transformHud CSS removed with the dead rotate/scale degree HUD. */
    /* PP-3c — the Draw side panel (import / layers / pens) + the drag-drop overlay. */
    #drawPanel { flex: 0 0 244px; overflow: auto; background: #f0e7d4; border-left: 1px solid #d8cbb2;
      color: #3a352b; padding: 10px; font: 13px system-ui, sans-serif; }
    .dp-sec { margin-bottom: 16px; }
    .dp-head { font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; color: #6b6353; margin: 0 0 6px; }
    .dp-row { display: flex; gap: 4px; margin-bottom: 6px; }
    .dp-btn { background: #fbf6ec; color: #3a352b; border: 1px solid #d8cbb2; border-radius: 6px; padding: 5px 9px;
      font: 12px system-ui, sans-serif; cursor: pointer; }
    .dp-btn:hover { border-color: var(--sk-selection); }
    .dp-btn:disabled { opacity: .4; cursor: not-allowed; }
    #design-undo-row .dp-btn { flex: 1; text-align: center; }
    .dp-primary { width: 100%; background: var(--sk-selection); color: #fff; border-color: var(--sk-selection); padding: 7px; }
    .dp-list { display: flex; flex-direction: column; gap: 2px; }
    .dp-list .group-row, .dp-list .color-row, .dp-list .role-row, .dp-list .shape-row,
    .dp-list > div { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 5px; cursor: default; }
    .dp-list .chevron, .dp-list .vis { cursor: pointer; opacity: 0.7; }
    .dp-list .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.2); display: inline-block; }
    .dp-list input { font: inherit; border: 1px solid var(--sk-selection); border-radius: 4px; padding: 1px 4px; }
    #dropOverlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(47,143,127,0.12); border: 2px dashed var(--sk-selection); color: #2f8f7f; font: 600 15px system-ui, sans-serif;
      pointer-events: none; z-index: 8; }
    #dropOverlay.show { display: flex; }
    /* PP-4a — the Toolpath stage: the SHARED canvas (re-parented in) + its own side panel.
       LAYOUT-UNIFY: mirror the Design template so the canvas never jumps between tabs — a COLUMN of
       [reserved top strip = the #design-ribbon's 80px height | body ROW: panel LEFT 244px | #canvasWrap RIGHT].
       The strip is a minimal labelled bar (the ribbon's reserved space; tools stay on Design per the user decision). */
    #stage-toolpath, #stage-export { padding: 0; }
    #toolpathRoot, #exportRoot { position: absolute; inset: 0; display: flex; flex-direction: column; }
    .tp-strip { flex: 0 0 80px; box-sizing: border-box; display: flex; align-items: center; padding: 0 14px;
      border-bottom: 1px solid #d8cbb2; background: #f0e7d4; color: #8a8067;
      font: 700 11px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }
    .tp-body { flex: 1 1 auto; display: flex; min-height: 0; }
    #toolpathPanel { flex: 0 0 244px; overflow: auto; background: #f0e7d4; border-right: 1px solid #d8cbb2;
      color: #3a352b; padding: 0; font: 13px system-ui, sans-serif; }
    .tp-note { color: #8a8067; font-size: 12px; line-height: 1.5; margin: 6px 0; padding: 0 12px; }
    /* TOOLPATH-POLISH: legacy .panel LAYOUT ported to the paper-light theme (copy layout, not dark colors) — <section>
       blocks with an <h2> label + border-bottom, a 2-col .field grid, .btn/.layer-actions rows, scrollable lists. */
    #toolpathPanel section { border-bottom: 1px solid #d8cbb2; padding-bottom: 8px; }
    #toolpathPanel section:last-child { border-bottom: 0; }
    #toolpathPanel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8a8067;
      margin: 0; padding: 10px 12px 6px; font-weight: 700; }
    #toolpathPanel .field { padding: 4px 12px; display: grid; grid-template-columns: 1fr 100px; gap: 8px; align-items: center; margin: 0; }
    #toolpathPanel .field label { font-size: 9px; color: #8a8067; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
    #toolpathPanel .field label small { color: #8a8067; display: block; font-size: 9px; font-style: italic; margin-top: 3px; text-transform: none; font-weight: normal; letter-spacing: 0; }
    #toolpathPanel .field input, #toolpathPanel .field select { background: #fbf6ec; border: 1px solid #d8cbb2; color: #3a352b;
      padding: 4px 6px; border-radius: 3px; font-size: 12px; width: 100%; box-sizing: border-box; }
    #toolpathPanel .field input:focus, #toolpathPanel .field select:focus { outline: 1px solid var(--sk-selection); }
    #toolpathPanel .layer-actions { display: flex; gap: 4px; padding: 4px 8px 0; }
    #toolpathPanel .btn { flex: 1; padding: 6px; font-size: 12px; cursor: pointer; background: #fbf6ec; border: 1px solid #d8cbb2;
      border-radius: 4px; color: #3a352b; transition: all 0.15s ease; min-height: 24px; line-height: 1.2; }
    #toolpathPanel .btn:hover { background: var(--sk-selection); color: #fff; border-color: var(--sk-selection); }
    #toolpathPanel .btn.primary { background: var(--sk-selection); color: #fff; border-color: var(--sk-selection); }
    #toolpathPanel #plotColors { max-height: 22vh; overflow-y: auto; padding: 4px 6px; }
    #toolpathPanel #toolpathLayers { max-height: 30vh; overflow-y: auto; padding: 4px 6px; }
    #recalcBtn.stale { background: var(--sk-selection); color: #fff; border-color: var(--sk-selection); }
    /* PP-4b — target-editing cue (double-click a toolpath row -> pick its target shapes; Esc exits). */
    body.target-editing #canvas { outline: 2px dashed var(--sk-selection); outline-offset: -2px; }
    #toolpathLayers select, #toolpathLayers input { font: inherit; border: 1px solid #d8cbb2; border-radius: 4px; padding: 1px 4px; }
    /* S2 — live op ROWS: hover / selected / cross-highlight + control cues (fixes 'no feedback or hover, poor UX'). */
    #toolpathLayers .tp-layer-row { cursor: pointer; transition: background 0.1s; }
    #toolpathLayers .tp-layer-row:hover { background: #e6dcc4; }
    #toolpathLayers .tp-layer-row.active, #toolpathLayers .tp-layer-row.selected { background: #dcd0b0; box-shadow: inset 2px 0 0 var(--sk-selection); }
    #toolpathLayers .tp-layer-row.geo-hovered { background: #efe6cf; box-shadow: inset 2px 0 0 #ff2e88; } /* its target geometry is hovered on canvas */
    #toolpathLayers .drag-handle { cursor: grab; opacity: 0.45; }
    #toolpathLayers .tp-layer-row:hover .drag-handle { opacity: 0.85; }
    #toolpathLayers .sw { cursor: pointer; }
    #toolpathLayers .ren, #toolpathLayers .del { opacity: 0.5; cursor: pointer; }
    #toolpathLayers .tp-layer-row:hover .ren, #toolpathLayers .tp-layer-row:hover .del { opacity: 1; }
    #toolpathLayers .del:hover { color: #d64545; }
    /* PP-5 — the Fill stage: the SHARED canvas (re-parented in) + the pattern/style inspector. */
    #stage-fill { padding: 0; }
    #fillRoot { position: absolute; inset: 0; display: flex; }
    #activeLayerPanel { flex: 0 0 244px; overflow: auto; background: #f0e7d4; border-left: 1px solid #d8cbb2;
      color: #3a352b; padding: 10px; font: 13px system-ui, sans-serif; }
    #activeLayerPanel h2 { font-size: 14px; margin: 0 0 8px; }
    #activeLayerPanel .subhead { font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px;
      color: #6b6353; margin: 12px 0 6px; }
    #activeLayerPanel .empty { color: #8a8067; font-size: 12px; }
    #activeLayerPanel .field { display: grid; grid-template-columns: 1fr 96px; align-items: center; gap: 6px; margin: 5px 0; }
    #activeLayerPanel .field label { font-size: 12px; color: #3a352b; }
    #activeLayerPanel .field label small { color: #8a8067; }
    #activeLayerPanel select, #activeLayerPanel input { font: inherit; border: 1px solid #d8cbb2; border-radius: 5px; padding: 3px 5px; }
    /* PP-6 — the Export stage: shared canvas (re-parented, pen-width sim) + Export action. LAYOUT-UNIFY: uses the
       shared #exportRoot column (strip + body) rule above; panel LEFT (border-right), canvas RIGHT. */
    #exportPanel { flex: 0 0 244px; overflow: auto; background: #f0e7d4; border-right: 1px solid #d8cbb2;
      color: #3a352b; padding: 10px; font: 13px system-ui, sans-serif; }
    #exportPanel .dp-head { font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px;
      color: #6b6353; margin: 12px 0 6px; }
    #exportPanel .field { display: grid; grid-template-columns: 1fr 96px; align-items: center; gap: 6px; margin: 5px 0; }
    #exportPanel .field label { font-size: 12px; }
    #exportPanel .field label small { color: #8a8067; }
    #exportPanel select, #exportPanel input { font: inherit; border: 1px solid #d8cbb2; border-radius: 5px; padding: 3px 5px; }
    #exportPanel input[type=checkbox] { justify-self: end; }
    #exportBtn { margin-top: 12px; }
    /* PP-7a — the Sketch stage IS the shared #core/#ui Design tab (its OWN svg canvas). CAD look, deliberately
       distinct from the warm-paper pen stages: revert the :root pen-ink overrides so the sketcher shows its CAD
       selection/hover blue (the DOF greens/blues in --sk-geo-* are never overridden, so they're already CAD), and
       give the chrome a cool neutral over a clean white canvas. Mirrors apps/shaper/index.html #design-view. */
    #stage-sketch { padding: 0; --sk-selection: #1e40af; --sk-hover: #3b82f6; --sk-origin: #3b82f6; }
    #design-view { position: absolute; inset: 0; display: flex; flex-direction: column; background: #eef1f6; }
    #design-ribbon { flex: 0 0 auto; width: 100%; overflow-x: auto; border-bottom: 1px solid #d7dce6; background: #f7f9fc; }
    #design-body { flex: 1 1 auto; display: flex; min-height: 0; }
    #design-panel { flex: 0 0 244px; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
      background: #f2f4f9; border-right: 1px solid #d7dce6; color: #2b3244; transition: flex-basis 0.15s ease; }
    #design-panel.collapsed { flex-basis: 30px; }
    #design-panel.collapsed #design-panel-info,
    #design-panel.collapsed #design-panel-actions { display: none; }
    #design-panel-actions { padding: 8px 8px 0; }
    /* DESIGN-PAPER-BOUNDS Part 0: the Document button — FIRST item, full-width, clear of the collapse arrow. */
    #designDocBtn { display: block; width: 100%; box-sizing: border-box; margin: 2px 0 10px; text-align: center; }
    #importStatus { font-size: 11px; color: #6b7280; margin: 4px 0; line-height: 1.4; }
    #design-panel-toggle { align-self: flex-end; background: transparent; border: 0; color: #6b7280; cursor: pointer;
      font: 13px system-ui, sans-serif; padding: 6px 8px; line-height: 1; }
    #design-panel-toggle:hover { color: #2b3244; }
    #design-panel.collapsed #design-panel-toggle { align-self: center; }
    #design-panel-info { flex: 1 1 auto; overflow: auto; min-height: 0; padding: 8px; }
    /* UNIFY-4c — the canvas WRAP holds the pen-color underlay BENEATH the (transparent) sketcher canvas; both share
       the same viewBox so the underlay's pen-colored art sits exactly under the DOF/scaffold the sketcher draws. */
    #design-canvas-wrap { flex: 1; position: relative; min-width: 0; min-height: 0; background: var(--sk-canvas-bg, #ffffff); }
    #design-paper, #pen-underlay, #design-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #design-paper, #pen-underlay { pointer-events: none; } /* backmost paper + underlay; clicks reach the sketcher on top */
    #design-canvas { background: transparent; }           /* transparent so the underlay shows through */
    #design-canvas.snapping { background-color: transparent; }
    /* STYLE-2 (was UNIFY-4c's lone colour row) — the per-shape STYLE section: Stroke colour + display width,
       Fill colour + a None toggle, then Pen-mix. Two-column .dp-field grid, matching the other panels' .field. */
    #shape-style { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e2ddd1; }
    #shape-style .dp-head { margin-bottom: 4px; }
    .dp-field { display: grid; grid-template-columns: 1fr 46px; align-items: center; gap: 6px; margin: 4px 0; font-size: 12px; }
    .dp-field label { color: #3a352b; }
    .dp-field label small { color: #8a8067; display: block; font-size: 10px; font-style: italic; }
    .dp-field input[type=color] { width: 46px; height: 24px; padding: 0; border: 1px solid #d7dce6; border-radius: 4px; background: none; }
    .dp-field input[type=number] { width: 46px; box-sizing: border-box; background: #fbf6ec; border: 1px solid #d8cbb2;
      border-radius: 4px; color: #3a352b; font: 12px system-ui, sans-serif; padding: 2px 4px; }
    .dp-field input:disabled { opacity: 0.4; }
    /* the None / Pen-mix checkbox rows span both columns (label carries its own box) */
    .dp-field.dp-check { grid-template-columns: 1fr; }
    .dp-field.dp-check label { display: flex; align-items: center; gap: 6px; }
    /* TOOLPATH-POLISH Part B: the gear trigger + doc/settings MODALS (legacy .overlay/.wiz-box layout, paper-light). */
    #toolpathPanel .tp-gear { float: right; background: none; border: 0; cursor: pointer; color: #8a8067; font-size: 13px; line-height: 1; padding: 0 2px; }
    #toolpathPanel .tp-gear:hover { color: var(--sk-selection); }
    .overlay { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
    .wiz-box { background: #f7f0e0; border: 1px solid #d8cbb2; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.3);
      padding: 16px; width: min(360px, 92vw); display: flex; flex-direction: column; gap: 12px; color: #3a352b; font: 13px system-ui, sans-serif; }
    .wiz-head { margin: -16px -16px 0; padding: 10px 15px; background: var(--sk-selection); color: #fff; border-radius: 6px 6px 0 0; }
    .wiz-head .preset-close { color: rgba(255,255,255,.85); background: none; border: 0; cursor: pointer; font-size: 14px; }
    .wiz-head .preset-close:hover { color: #fff; }
    .wiz-box .field { display: grid; grid-template-columns: 1fr 120px; gap: 8px; align-items: center; }
    .wiz-box .field label { font-size: 11px; color: #8a8067; text-transform: uppercase; font-weight: bold; }
    .wiz-box .field input, .wiz-box .field select { background: #fff; border: 1px solid #d8cbb2; border-radius: 3px; padding: 4px 6px; width: 100%; box-sizing: border-box; color: #3a352b; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
    .setting-row > span { font-size: 13px; }
    .setting-row small { display: block; color: #8a8067; font-size: 11px; margin-top: 2px; }
    .setting-row input[type=checkbox] { width: 16px; height: 16px; flex: none; cursor: pointer; }
    /* BURN-DOWN-5: Done/Cancel footer for the modals. Done keeps edits; Cancel/✕/backdrop/Esc revert. */
    .wiz-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .wiz-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #d8cbb2; background: #fbf6ec; color: #3a352b;
      cursor: pointer; font: 13px system-ui, sans-serif; }
    .wiz-btn:hover { border-color: var(--sk-selection); }
    .wiz-btn.primary { background: var(--sk-selection); color: #fff; border-color: var(--sk-selection); }
  </style>
</head>
<body>
  <header class="toolbar">
    <!-- The shared two-way app-switcher (mounted in main.js): marks Pen Plotter current, navigates to the siblings. -->
    <span id="app-switcher-host"></span>
    <!-- PERSIST-2: a passive autosave status indicator (never a blocking prompt) -->
    <span id="save-status" class="save-status"></span>
    <!-- The 5-stage pipeline nav — built by ITERATING the STAGES registry in main.js (never hardcoded). -->
    <nav id="mode-nav" class="mode-nav"></nav>
    <span class="spacer"></span>
  </header>
  <!-- Stage bodies are created from STAGES in main.js (one source of truth), then shown/hidden by the router. -->
  <main id="stages" class="stages"></main>

  <!-- TOOLPATH-POLISH Part B: Document + Settings modals (legacy). #docModal opens from the #docInfo canvas readout;
       #settingsModal from the Toolpath "Plotter Settings" gear. settings.js installSettingsPanel wireModals both +
       binds #docW/#docH/#docUnit/#autoRecalcToggle (they live here now, always present so the binding never throws). -->
  <div id="docModal" class="overlay" style="display:none;">
    <div class="wiz-box">
      <div class="wiz-head" style="display:flex; justify-content:space-between; align-items:center; font-weight:600;">
        <span>Document</span><button class="preset-close" id="docModalClose" title="Close">&#10005;</button>
      </div>
      <div class="field"><label>Units</label><select id="docUnit"><option value="mm">mm</option><option value="in">inches</option></select></div>
      <div class="field"><label>Width <small class="doc-unit-label">mm</small></label><input type="number" id="docW" min="10" max="2000" step="1"></div>
      <div class="field"><label>Height <small class="doc-unit-label">mm</small></label><input type="number" id="docH" min="10" max="2000" step="1"></div>
      <div class="wiz-actions">
        <button class="wiz-btn" id="docCancel">Cancel</button>
        <button class="wiz-btn primary" id="docDone">Done</button>
      </div>
    </div>
  </div>
  <div id="settingsModal" class="overlay" style="display:none;">
    <div class="wiz-box">
      <div class="wiz-head" style="display:flex; justify-content:space-between; align-items:center; font-weight:600;">
        <span>Settings</span><button class="preset-close" id="settingsModalClose" title="Close">&#10005;</button>
      </div>
      <label class="setting-row">
        <span>Auto-recalculate toolpaths<small>Recompute whenever the artwork changes. Off: use the Recalculate button.</small></span>
        <input type="checkbox" id="autoRecalcToggle">
      </label>
      <div class="wiz-actions">
        <button class="wiz-btn" id="settingsCancel">Cancel</button>
        <button class="wiz-btn primary" id="settingsDone">Done</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
