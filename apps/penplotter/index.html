<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pen Plotter — Sketch Studio</title>
  <!-- Shared sketcher theme contract (mirrors Shaper). The :root override BELOW is after the link, so the
       plotter's own look wins. Placeholder-level theming for PP-1 — the real canvas theming lands in PP-3+. -->
  <link rel="stylesheet" href="../../packages/ui/sketcher.css">
  <!-- Isomorphic aliases (mirror Shaper + package.json): #core = shared brain, #ui = shared UI.
       Declared now for the shared engines/Design tab that arrive in PP-2..PP-5; unused this slice. -->
  <script type="importmap">
  {
    "imports": {
      "#core/": "../../packages/core/",
      "#ui/": "../../packages/ui/"
    }
  }
  </script>
  <style>
    /* Pen Plotter = a THIRD, visually distinct shell: warm PAPER-LIGHT (Studio is cool light, Shaper is dark),
       with a teal "plotter ink" accent. Keeps the three shells distinguishable (project theme rule). */
    :root {
      --sk-selection: #2f8f7f;            /* plotter ink (teal) — distinct from Studio/Shaper blue */
      --sk-hover: #57b0a1;
      --sk-header-bg: #f0e7d4;
      --sk-header-fg: #3a352b;
      --sk-header-sep: #d8cbb2;
      --sk-header-hover: rgba(47, 143, 127, 0.12);
      --sk-ribbon-menu-bg: #fbf6ec;
      --canvas-bg: #fdfcf8;               /* PP-3a: the Draw-stage paper fill (read by render-art buildPaper) */
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #f5efe1; color: #3a352b; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; }
    header.toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; height: 44px; padding: 0 12px;
      background: var(--sk-header-bg); border-bottom: 1px solid var(--sk-header-sep); color: var(--sk-header-fg); }
    #app-switcher-host { display: inline-flex; }
    .mode-nav { display: flex; gap: 4px; align-items: center; }
    .stage-btn { background: transparent; color: #6b6353; border: 0; border-radius: 6px; padding: 5px 14px; cursor: pointer;
      font: 13px system-ui, sans-serif; opacity: 0.8; }
    .stage-btn:hover { background: var(--sk-header-hover); opacity: 1; }
    .stage-btn.active { background: var(--sk-selection); color: #fff; opacity: 1; }
    .stage-btn .opt { font-size: 11px; opacity: 0.65; margin-left: 5px; }
    .spacer { flex: 1; }
    main.stages { flex: 1 1 auto; position: relative; min-height: 0; }
    .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 24px; text-align: center; }
    .stage[hidden] { display: none; }
    .stage h2 { margin: 0; font-size: 24px; font-weight: 700; color: #3a352b; }
    .stage p { margin: 0; color: #8a8067; max-width: 42ch; line-height: 1.5; }
    .stage .badge { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sk-selection); font-weight: 700; }
    /* PP-3a — the Draw stage: a full-bleed canvas (the plotter's own freeform art surface). The scaffold's
       #canvasWrap is absolutely positioned, so the .stage flex-centering (used by the other stubs) ignores it. */
    /* PP-3c — the Draw stage is now canvas + a side panel (import / layers / pens). */
    #stage-draw { padding: 0; }
    #drawRoot { position: absolute; inset: 0; display: flex; }
    #canvasWrap { flex: 1 1 auto; position: relative; overflow: hidden; background: #efe9dd; min-width: 0; }
    #canvas { display: block; }
    #docInfo { position: absolute; left: 12px; bottom: 10px; font: 12px system-ui, sans-serif; color: #8a8067; pointer-events: none; }
    #toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); background: #2f8f7f; color: #fff;
      padding: 6px 12px; border-radius: 8px; font: 13px system-ui, sans-serif; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
    #toast.show { opacity: 1; }
    /* PP-3b — the floating tool stack + transform HUD + coord readout over the Draw canvas. */
    #canvas.tool-line, #canvas.tool-rect, #canvas.tool-ellipse, #canvas.tool-polyline, #canvas.tool-freehand { cursor: crosshair; }
    #allTools { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
    .tool { background: #fbf6ec; color: #3a352b; border: 1px solid #d8cbb2; border-radius: 6px; padding: 4px 9px;
      font: 12px system-ui, sans-serif; cursor: pointer; text-align: left; }
    .tool:hover { border-color: var(--sk-selection); }
    .tool.active { background: var(--sk-selection); color: #fff; border-color: var(--sk-selection); }
    #coords { position: absolute; right: 12px; bottom: 10px; font: 12px system-ui, sans-serif; color: #8a8067; pointer-events: none; }
    #transformHud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px;
      align-items: center; background: #fbf6ec; border: 1px solid #d8cbb2; border-radius: 8px; padding: 6px 10px; z-index: 6; }
    #transformHud[hidden] { display: none; }
    #transformHud input { width: 80px; }
    /* PP-3c — the Draw side panel (import / layers / pens) + the drag-drop overlay. */
    #drawPanel { flex: 0 0 244px; overflow: auto; background: #f0e7d4; border-left: 1px solid #d8cbb2;
      color: #3a352b; padding: 10px; font: 13px system-ui, sans-serif; }
    .dp-sec { margin-bottom: 16px; }
    .dp-head { font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; color: #6b6353; margin: 0 0 6px; }
    .dp-row { display: flex; gap: 4px; margin-bottom: 6px; }
    .dp-btn { background: #fbf6ec; color: #3a352b; border: 1px solid #d8cbb2; border-radius: 6px; padding: 5px 9px;
      font: 12px system-ui, sans-serif; cursor: pointer; }
    .dp-btn:hover { border-color: var(--sk-selection); }
    .dp-primary { width: 100%; background: var(--sk-selection); color: #fff; border-color: var(--sk-selection); padding: 7px; }
    .dp-list { display: flex; flex-direction: column; gap: 2px; }
    .dp-list .group-row, .dp-list .color-row, .dp-list .role-row, .dp-list .shape-row,
    .dp-list > div { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 5px; cursor: default; }
    .dp-list .chevron, .dp-list .vis { cursor: pointer; opacity: 0.7; }
    .dp-list .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.2); display: inline-block; }
    .dp-list input { font: inherit; border: 1px solid var(--sk-selection); border-radius: 4px; padding: 1px 4px; }
    #dropOverlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(47,143,127,0.12); border: 2px dashed var(--sk-selection); color: #2f8f7f; font: 600 15px system-ui, sans-serif;
      pointer-events: none; z-index: 8; }
    #dropOverlay.show { display: flex; }
    /* PP-4a — the Toolpath stage: the SHARED canvas (re-parented in) + its own side panel. */
    #stage-toolpath { padding: 0; }
    #toolpathRoot { position: absolute; inset: 0; display: flex; }
    #toolpathPanel { flex: 0 0 244px; overflow: auto; background: #f0e7d4; border-left: 1px solid #d8cbb2;
      color: #3a352b; padding: 10px; font: 13px system-ui, sans-serif; }
    .tp-note { color: #8a8067; font-size: 12px; line-height: 1.5; margin: 6px 0; }
  </style>
</head>
<body>
  <header class="toolbar">
    <!-- The shared two-way app-switcher (mounted in main.js): marks Pen Plotter current, navigates to the siblings. -->
    <span id="app-switcher-host"></span>
    <!-- The 5-stage pipeline nav — built by ITERATING the STAGES registry in main.js (never hardcoded). -->
    <nav id="mode-nav" class="mode-nav"></nav>
    <span class="spacer"></span>
  </header>
  <!-- Stage bodies are created from STAGES in main.js (one source of truth), then shown/hidden by the router. -->
  <main id="stages" class="stages"></main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
