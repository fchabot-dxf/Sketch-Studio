  :root { color-scheme: light dark; --fg: #222; --bg: #fff; --muted: #666; --line: #ccc; --link: #0b57d0; --card: #f6f7f9; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e8eb; --bg: #1f2023; --muted: #9aa0a8; --line: #3a3d42; --link: #8ab4f8; --card: #2a2c30; } }
  body { font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 40em; margin: 0 auto; padding: 1.5em 1em 3em; color: var(--fg); background: var(--bg); }

  .apps { list-style: none; margin: 1.4em 0; padding: 0; display: grid; gap: .9em; }
  .app { display: flex; gap: 1em; align-items: flex-start; padding: 1em; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .app img { width: 56px; height: 56px; flex: none; }
  .app p { margin: .2em 0; }
  .addin { font-size: .95em; }
  hr { margin: 2em 0; border: 0; border-top: 1px solid var(--line); }
</style>
